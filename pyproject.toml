[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-docs-crawler"
version = "0.1.0"
description = "A reusable asynchronous crawler for documentation websites."
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "beautifulsoup4>=4.12.0",
    "crawl4ai>=0.6.0",
    "markdownify>=0.13.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.7.0",
    "trafilatura>=1.9.0",
]

[project.scripts]
docs-crawl = "crawler.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["crawler", "crawler.*"]
namespaces = false

[tool.ruff]
line-length = 100
